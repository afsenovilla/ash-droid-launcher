plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.afsenovilla.ashdroid'
    compileSdk 33
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "io.github.afsenovilla.ashdroid"
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "0.1.0-dev"
        archivesBaseName = "ash-droid-launcher-$versionName"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Release builds are signed with a private key that never lives in the repo.
    // Provide it via environment variables (CI decodes it from secrets):
    //   ASHDROID_KEYSTORE        path to the .jks file
    //   ASHDROID_STORE_PASSWORD, ASHDROID_KEY_ALIAS, ASHDROID_KEY_PASSWORD
    // Debug builds use the standard Android debug key, so they can never
    // replace a release install.
    def releaseKeystore = System.getenv("ASHDROID_KEYSTORE")
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ASHDROID_STORE_PASSWORD")
                keyAlias System.getenv("ASHDROID_KEY_ALIAS")
                keyPassword System.getenv("ASHDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}

// Refuse to produce a release APK without the private signing key.
// (Compiling release Java alone, e.g. the CI compile check, needs no key.)
gradle.taskGraph.whenReady { graph ->
    // Only the tasks that produce a signed release APK/AAB need the key. Compiling
    // release code (CI compile check) must not, and AGP adds helper tasks such as
    // validateSigningRelease even then, so look at the final packaging tasks only.
    def packaging = graph.allTasks.any { it.name in ["packageRelease", "packageReleaseBundle", "signReleaseBundle"] }
    if (packaging) {
        def missing = ["ASHDROID_KEYSTORE", "ASHDROID_STORE_PASSWORD", "ASHDROID_KEY_ALIAS", "ASHDROID_KEY_PASSWORD"]
                .findAll { !System.getenv(it) }
        if (missing) throw new GradleException("Release signing not configured, missing: " + missing.join(", "))
        if (!file(System.getenv("ASHDROID_KEYSTORE")).isFile()) throw new GradleException("ASHDROID_KEYSTORE does not point to a file")
    }
}
