plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.afsenovilla.ashdroid'
    compileSdk 33
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "io.github.afsenovilla.ashdroid"
        minSdk 24
        targetSdk 33
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName System.getenv("VERSION_NAME") ?: "0.1.0-dev"
        archivesBaseName = "ash-droid-launcher-$versionName"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Stable signing key so updates install over the previous version
        // without losing saves. See keystore/README.md.
        stable {
            storeFile file("../keystore/ashdroid.jks")
            storePassword System.getenv("ASHDROID_STORE_PASSWORD") ?: "ashdroid"
            keyAlias System.getenv("ASHDROID_KEY_ALIAS") ?: "ashdroid"
            keyPassword System.getenv("ASHDROID_KEY_PASSWORD") ?: "ashdroid"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
