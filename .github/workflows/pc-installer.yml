# Windows installer of the PC patch ("Instalar parche.exe", WinForms on .NET Framework 4).
# Called by build.yml for every build.
name: PC installer

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build installer (WinForms, .NET Framework 4)
        shell: pwsh
        run: |
          $csc = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "MSBuild\**\Roslyn\csc.exe" | Select-Object -First 1
          Write-Host "csc: $csc"
          New-Item -ItemType Directory -Force out | Out-Null
          & $csc /nologo /target:winexe /optimize+ /langversion:7.3 `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            "/out:out/Instalar parche.exe" tools/pc/installer/Installer.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: pc-installer
          path: out/
