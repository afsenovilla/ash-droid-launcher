name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 25.2.9519653
  ABI: arm64-v8a
  API: 24

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool bison gperf ruby xxd wget

      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" > /dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Fails in ~2 min on Java errors, before the long native build
      - name: Java compile check
        run: ./gradlew --no-daemon -q compileReleaseJavaWithJavac

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            app/jni/build-arm64-v8a
            app/jni/libogg
            app/jni/libvorbis
            app/jni/libtheora
            app/jni/libiconv
            app/jni/uchardet
            app/jni/pixman
            app/jni/physfs
            app/jni/openal
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_ttf
            app/jni/SDL2_sound
            app/jni/openssl
            app/jni/ruby
          key: native-v1-${{ env.NDK_VERSION }}-${{ env.ABI }}-${{ hashFiles('app/jni/Makefile', 'app/jni/get_deps.sh') }}

      - name: Fetch native sources
        working-directory: app/jni
        run: bash ./get_deps.sh

      - name: Build native libraries (iconv, OpenAL, OpenSSL, Ruby)
        working-directory: app/jni
        run: |
          make ARCH=linux-x86_64 API=${API} ABI=${ABI} \
               HOST=aarch64-linux-android TARGET=aarch64-linux-android

      - name: Generate embedded mkxp-z assets
        working-directory: app/jni/mkxp-z
        run: bash ./make_xxd.sh > /dev/null

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ash-droid-launcher-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/ash-droid-launcher-dev.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ash-droid-launcher-${{ env.VERSION_NAME }}
          path: dist/ash-droid-launcher-${{ env.VERSION_NAME }}.apk

      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ash-droid-launcher-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true

      - name: Move "dev" tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f dev
          git push -f origin dev

      - name: Publish rolling dev build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build (último commit de main)
          prerelease: true
          files: dist/ash-droid-launcher-dev.apk
          body: |
            Compilación automática del último commit de `main` (${{ github.sha }}).
            Para versiones estables, mira las releases `v*`.
