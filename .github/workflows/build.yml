name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a stable release with this version (e.g. 0.2.0). Needs a "## [x.y.z]" section in CHANGELOG.md. Leave empty to only build (nothing is published). Pushing a vX.Y.Z tag does the same as this.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 25.2.9519653
  ABI: arm64-v8a
  API: 24

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags + history for versioning and release notes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool bison gperf ruby xxd wget

      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" > /dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Version
        id: version
        run: |
          REL="${{ github.event.inputs.release }}"
          if [ -n "$REL" ]; then
            REL="${REL#v}"
            [[ "$REL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version '$REL'"; exit 1; }
            grep -q "^## \[$REL\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$REL]' section"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$REL" >/dev/null; then echo "::error::Tag v$REL already exists"; exit 1; fi
            echo "VERSION_NAME=$REL" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
            # Tag locally so release notes can compute the commit range
            git tag "v$REL"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            # Not a release (push to main / PR): only built, never published. Next patch after
            # the last tag + commits since it, e.g. 0.1.1-build.4
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            IFS=. read -r ma mi pa <<< "${last#v}"
            n=$(git rev-list --count "${last}..HEAD" 2>/dev/null || git rev-list --count HEAD)
            echo "VERSION_NAME=${ma}.${mi}.$((pa+1))-build.${n}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          { echo "version=$(grep '^VERSION_NAME=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)"
            echo "release=$(grep '^RELEASE=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)"; } >> "$GITHUB_OUTPUT"

      # Fails in ~2 min on Java errors, before the long native build
      - name: Java compile check
        run: ci/run.sh java-check ./gradlew --no-daemon compileReleaseJavaWithJavac

      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/jni/build-arm64-v8a
            app/jni/libogg
            app/jni/libvorbis
            app/jni/libtheora
            app/jni/libiconv
            app/jni/uchardet
            app/jni/pixman
            app/jni/physfs
            app/jni/openal
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_ttf
            app/jni/SDL2_sound
            app/jni/openssl
            app/jni/ruby
          key: native-v1-${{ env.NDK_VERSION }}-${{ env.ABI }}-${{ hashFiles('app/jni/Makefile', 'app/jni/get_deps.sh') }}-${{ github.run_id }}
          restore-keys: |
            native-v1-${{ env.NDK_VERSION }}-${{ env.ABI }}-

      - name: Fetch native sources
        working-directory: app/jni
        run: $GITHUB_WORKSPACE/ci/run.sh get-deps bash ./get_deps.sh

      - name: Build native libraries (iconv, OpenAL, OpenSSL, Ruby)
        working-directory: app/jni
        run: |
          $GITHUB_WORKSPACE/ci/run.sh native-deps make ARCH=linux-x86_64 API=${API} ABI=${ABI} \
               HOST=aarch64-linux-android TARGET=aarch64-linux-android

      - name: Diagnose Ruby build (only on failure)
        if: failure()
        working-directory: app/jni/ruby
        run: |
          make V=1 -j1 > ../ruby-diag.log 2>&1 || true
          # One annotation per line (annotations are truncated around 4 KB)
          n=0
          tail -9 ../ruby-diag.log | while IFS= read -r line; do
            n=$((n+1))
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' | rev | cut -c1-3500 | rev)
            echo "::error title=ruby diag line $n::$msg"
          done

      # Saved even if the build fails, so finished libraries (OpenSSL, iconv…) aren't rebuilt
      - name: Save native dependencies
        if: always() && steps.native-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            app/jni/build-arm64-v8a
            app/jni/libogg
            app/jni/libvorbis
            app/jni/libtheora
            app/jni/libiconv
            app/jni/uchardet
            app/jni/pixman
            app/jni/physfs
            app/jni/openal
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_ttf
            app/jni/SDL2_sound
            app/jni/openssl
            app/jni/ruby
          key: native-v1-${{ env.NDK_VERSION }}-${{ env.ABI }}-${{ hashFiles('app/jni/Makefile', 'app/jni/get_deps.sh') }}-${{ github.run_id }}

      - name: Generate embedded mkxp-z assets
        working-directory: app/jni/mkxp-z
        run: bash ./make_xxd.sh > /dev/null

      - name: Build translation packs
        run: ruby tools/translation/build_pack.rb

      - name: Build APK
        run: ci/run.sh gradle-apk ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ash-droid-launcher-${VERSION_NAME}.apk"
          ls -la dist

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci-logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  # Engine for the Steam Deck / Linux package (cached: only compiled when mkxp-z changes)
  linux:
    uses: ./.github/workflows/linux-runtime.yml

  pc-installer:
    uses: ./.github/workflows/pc-installer.yml

  # PC patch packages (no game files: the images are redrawn by the patch while the game runs)
  #   Windows:           "Instalar parche.exe" + the patch
  #   Steam Deck / Linux: "Instalar en Steam Deck.sh" + native Linux engine + the patch
  pc-packages:
    needs: [apk, linux, pc-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pc-installer
          path: in
      - uses: actions/download-artifact@v4
        with:
          name: mkxp-z-linux-x86_64
          path: in
      - name: Build packages
        run: |
          V="${{ needs.apk.outputs.version }}"
          mkdir -p dist
          tools/pc/build_pc_patch.sh windows "dist/FireAsh-Espanol-Espana-Windows-${V}.zip" "$V" "in/Instalar parche.exe"
          tools/pc/build_pc_patch.sh linux "dist/FireAsh-Espanol-Espana-SteamDeck-Linux-${V}.zip" "$V" in/mkxp-z-linux-x86_64.tar.gz
          for z in dist/*.zip; do echo "== $z"; unzip -l "$z" | tail -n +4 | head -n -2; done
      - uses: actions/upload-artifact@v4
        with:
          name: pc-packages
          path: dist/*.zip

  # Stable release (tag vX.Y.Z, or "Run workflow" with a version): APK + Windows + Steam Deck/Linux
  release:
    needs: [apk, pc-packages]
    if: needs.apk.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: ${{ needs.apk.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pc-packages
          path: dist
      - name: Release notes
        run: |
          ls -la dist
          git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null || git tag "v$VERSION_NAME"
          ci/release-notes.sh "$VERSION_NAME" > dist/notes.md
          cat >> dist/notes.md <<'EOF'

          ## Downloads
          | | |
          |---|---|
          | **Android** (Retroid, AYN, Anbernic…) | `ash-droid-launcher-*.apk` |
          | **Windows** | `FireAsh-Espanol-Espana-Windows-*.zip` → "Instalar parche.exe" |
          | **Steam Deck / Linux** | `FireAsh-Espanol-Espana-SteamDeck-Linux-*.zip` → "Instalar en Steam Deck.sh" (desktop mode) |
          EOF
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Ash Droid Launcher v${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            dist/ash-droid-launcher-${{ env.VERSION_NAME }}.apk
            dist/FireAsh-Espanol-Espana-Windows-${{ env.VERSION_NAME }}.zip
            dist/FireAsh-Espanol-Espana-SteamDeck-Linux-${{ env.VERSION_NAME }}.zip
          body_path: dist/notes.md

      # Only versioned releases from now on: remove the old rolling "dev" build and the
      # build-tool prereleases.
      - name: Remove old prereleases
        continue-on-error: true
        run: |
          for t in dev pc-installer linux-runtime; do
            gh release delete "$t" --cleanup-tag --yes 2>/dev/null && echo "removed $t" || true
          done
