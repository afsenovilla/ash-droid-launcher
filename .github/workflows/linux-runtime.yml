# Native Linux builds of mkxp-z (the engine Fire Ash already uses on Windows):
#   x86_64   Steam Deck / Linux package of the PC patch
#   aarch64  handheld package (Anbernic H700 consoles: RG34XX, RG35XX..., running Knulli etc.)
# Same recipe as mkxp-z's own CI: clang against an Ubuntu 16.04 sysroot (old glibc, so it runs on
# any current firmware), every library vendored and linked in. Called by build.yml for every
# build; each engine is cached by mkxp-z commit (bump ENGINE_CACHE to force a rebuild), so it is
# only compiled when it changes. The x86_64 smoke test runs every time, against the current patch;
# the aarch64 engine can't run on the CI machine, so it is inspected instead (ELF type, libraries,
# glibc version) and tested on the consoles themselves.
name: Linux runtime

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # mkxp-z 2.4.2 (same engine line as the Android build)
  MKXPZ_REPO: mkxp-z/mkxp-z
  MKXPZ_REF: 37a04d14413454551a7b6aadbb4e93e67168accb
  ENGINE_CACHE: v1

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            # The runner image stays as it was, so the cached engine keeps being valid
            runner: ubuntu-24.04
            debian: amd64
            repo: http://archive.ubuntu.com/ubuntu
            target: x86_64-linux-gnu
            cpu_family: x86_64
          - arch: aarch64
            # Like mkxp-z's own arm64 job: its qemu-user-binfmt lets debootstrap run the arm64 chroot
            # (on ubuntu-24.04 the chroot test /bin/true failed)
            runner: ubuntu-26.04
            debian: arm64
            repo: http://ports.ubuntu.com/ubuntu-ports
            target: aarch64-linux-gnu
            cpu_family: aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Engine from cache
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: out/mkxp-z-linux-${{ matrix.arch }}.tar.gz
          key: mkxpz-linux-${{ matrix.arch }}-${{ env.ENGINE_CACHE }}-${{ env.MKXPZ_REF }}

      - name: Checkout mkxp-z
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MKXPZ_REPO }}
          ref: ${{ env.MKXPZ_REF }}
          path: mkxp-z

      - name: Install dependencies
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison ccache cmake diffutils git make ruby clang lld llvm \
            debootstrap gpg qemu-user-binfmt xvfb mesa-utils libgl1-mesa-dri python3-pip
          # mkxp-z needs Meson >= 1.4
          pip3 install --break-system-packages 'meson>=1.4,<2' ninja
          meson --version

      - name: Set up sysroot (Ubuntu 16.04)
        if: steps.engine.outputs.cache-hit != 'true'
        shell: bash tools/linux/ci_step.sh sysroot {0}
        run: |
          keyrings="$(realpath mkxp-z/keyrings)"
          cd ${{ runner.temp }}
          repo=${{ matrix.repo }}
          sudo debootstrap --arch=${{ matrix.debian }} --variant=minbase --keyring="$keyrings/ubuntu.gpg" xenial sysroot $repo
          sudo cp "$keyrings/ubuntu-toolchain-r.gpg" sysroot/
          echo "deb $repo xenial-updates main" | sudo tee -a sysroot/etc/apt/sources.list > /dev/null
          echo 'deb [signed-by=/ubuntu-toolchain-r.gpg] http://ppa.launchpad.net/ubuntu-toolchain-r/test/ubuntu xenial main' | sudo tee -a sysroot/etc/apt/sources.list > /dev/null

          fs_spec=$(od -N 32 -x /dev/urandom | cut -b 9- | tr -d ' \n')
          sudo mount -t devtmpfs $fs_spec sysroot/dev
          sudo mount -t devpts $fs_spec sysroot/dev/pts
          sudo mount -t tmpfs $fs_spec sysroot/dev/shm
          sudo mount -t proc $fs_spec sysroot/proc
          sudo mount -t tmpfs $fs_spec sysroot/tmp
          sudo mount -t sysfs $fs_spec sysroot/sys
          sudo rm -f sysroot/etc/resolv.conf
          sudo cp /etc/resolv.conf sysroot/etc/
          PATH=/usr/sbin:/usr/bin:/sbin:/bin sudo chroot sysroot /bin/bash -eo pipefail << 'EOF'
            apt update
            apt install -y gcc-9 g++-9
            find /lib /usr/include /usr/lib -type l -exec ln -srf {} {} \;
          EOF
          grep "^$fs_spec " /proc/mounts | cut -d ' ' -f 2 | sort -r | tr '\n' '\0' | xargs -0 -n 1 printf '%b\0' | xargs -0 -n 1 sudo umount

      - name: Restore ccache
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: linux-${{ matrix.arch }}-${{ env.MKXPZ_REF }}-
          restore-keys: linux-${{ matrix.arch }}-

      - name: Configure
        if: steps.engine.outputs.cache-hit != 'true'
        shell: bash tools/linux/ci_step.sh configure {0}
        run: |
          cd mkxp-z
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          cat > ${{ runner.temp }}/cross.toml << EOF
          [binaries]
          c = ['ccache', 'clang', '--sysroot=${{ runner.temp }}/sysroot', '--target=${{ matrix.target }}']
          c_ld = 'lld'
          cpp = ['ccache', 'clang++', '--sysroot=${{ runner.temp }}/sysroot', '--target=${{ matrix.target }}']
          cpp_ld = 'lld'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          cmake = 'cmake'
          [host_machine]
          system = 'linux'
          cpu_family = '${{ matrix.cpu_family }}'
          cpu = '${{ matrix.arch }}'
          endian = 'little'
          EOF
          meson setup --prefix "$(pwd)/build/artifact" --cross-file ${{ runner.temp }}/cross.toml \
            --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        if: steps.engine.outputs.cache-hit != 'true'
        id: build
        working-directory: mkxp-z
        run: |
          code=0
          ninja -C build > ${{ runner.temp }}/ninja.log 2>&1 || code=$?
          tail -n 200 ${{ runner.temp }}/ninja.log
          if [ "$code" != 0 ]; then
            msg=$(grep -B2 -A12 -m3 -E "error|FAILED" ${{ runner.temp }}/ninja.log | tail -n 60 | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build failed::$msg"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save ccache
        if: always() && steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: linux-${{ matrix.arch }}-${{ env.MKXPZ_REF }}-${{ steps.build.outputs.time }}

      - name: Package
        if: steps.engine.outputs.cache-hit != 'true'
        shell: bash tools/linux/ci_step.sh package {0}
        run: |
          [ "${{ steps.build.outputs.code }}" = 0 ] || exit 1
          meson install -C mkxp-z/build --no-rebuild --tags mkxp-z
          A=mkxp-z/build/artifact
          ls -la "$A"
          # The game's own mkxp.json is used; the engine's default one is not shipped
          rm -f "$A/mkxp.json"
          printf '%s\n' "${{ env.MKXPZ_REPO }}@${{ env.MKXPZ_REF }}" > "$A/MKXPZ_VERSION.txt"
          mkdir -p out
          tar -C "$A" -czf out/mkxp-z-linux-${{ matrix.arch }}.tar.gz .
          ls -la out

      - name: Save engine to cache
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/mkxp-z-linux-${{ matrix.arch }}.tar.gz
          key: mkxpz-linux-${{ matrix.arch }}-${{ env.ENGINE_CACHE }}-${{ env.MKXPZ_REF }}

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-linux-${{ matrix.arch }}
          path: out/mkxp-z-linux-${{ matrix.arch }}.tar.gz

      - name: Inspect engine (aarch64 can't run on this machine)
        if: matrix.arch == 'aarch64'
        run: |
          set -x
          T=$(mktemp -d); tar -C "$T" -xzf out/mkxp-z-linux-${{ matrix.arch }}.tar.gz
          B="$T/mkxp-z.aarch64"
          # llvm-readelf only exists when the engine was just built (its toolchain is installed then);
          # with the engine from cache, binutils' readelf (always on the runner) reads aarch64 too
          RE=$(command -v llvm-readelf || command -v readelf)
          ls -la "$T" | head -30
          $RE -h "$B" | grep -E 'Class|Machine|Type'
          $RE -h "$B" | grep -q 'AArch64'
          # Libraries the console must provide (everything else is linked in)
          $RE -d "$B" | grep NEEDED
          # Highest glibc symbol version the binary asks for: it must run on old firmware
          $RE -V "$B" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 3
          max=$($RE -V "$B" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "highest glibc: $max"
          printf '%s\n' "highest glibc: $max" >> "$GITHUB_STEP_SUMMARY"
          # Dynamic GLES/EGL must be loaded at run time from the console's own driver, not linked in
          $RE -d "$B" | grep NEEDED | grep -E 'libGLESv2|libEGL' && echo "note: links GLES/EGL directly" || true

      - name: Smoke test tools
        if: matrix.arch == 'x86_64' && steps.engine.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri ruby

      - name: Smoke test (stdlib, preload script, Steam Deck detection)
        if: matrix.arch == 'x86_64'
        shell: bash tools/linux/ci_step.sh smoke {0}
        run: |
          set -x
          # Same layout as the installer: engine in <game>/ashdroid_linux, started with SRCDIR=<game>
          T=$(mktemp -d); mkdir -p "$T/game/ashdroid_linux"
          tar -C "$T/game/ashdroid_linux" -xzf out/mkxp-z-linux-${{ matrix.arch }}.tar.gz
          ls "$T/game/ashdroid_linux" "$T/game/ashdroid_linux/stdlib" | head -40
          cp app/src/main/assets/ashdroid_patches.rb app/src/main/assets/ashdroid_art.rb "$T/game/"
          ruby tools/art/make_art_dat.rb app/src/main/assets/packs/fire-ash/art.json "$T/game/ashdroid_art.dat"
          mkdir -p "$T/game/Data"
          ruby -rzlib -e 'File.binwrite(ARGV[1], Marshal.dump([[0, "Main", Zlib::Deflate.deflate(File.read(ARGV[0]))]]))' \
            tools/linux/smoke_test.rb "$T/game/Data/Scripts.rxdata"
          printf '[Game]\r\nTitle=Smoke\r\nScripts=Data\\Scripts.rxdata\r\n' > "$T/game/Game.ini"
          printf '{ "preloadScript": ["ashdroid_patches.rb"], "rgssVersion": 1 }\n' > "$T/game/mkxp.json"
          cd "$T/game"
          SteamDeck=1 SRCDIR="$T/game" LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy ALSOFT_DRIVERS=null \
            timeout 120 xvfb-run -a -s '-screen 0 1280x800x24' "$T/game/ashdroid_linux/mkxp-z.${{ matrix.arch }}" || true
          cat smoke_test.log
          cat ashdroid_patch.log || true
          grep -q '^OK' smoke_test.log
